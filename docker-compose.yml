# =============================================================================
# llama-hub — servicio base (modo CPU).
#
# Normalmente NO se arranca a mano: usa ./serve/<modelo>.sh, que combina este
# fichero con el override del backend detectado, por ejemplo:
#   docker compose -f docker-compose.yml -f compose/docker-compose.nvidia.yml up -d
#
# Los flags del modelo NO van aquí: se pasan al contenedor mediante el fichero
# .run/model.env (variables nativas LLAMA_ARG_* que genera el script de modelo).
# =============================================================================
name: llama-hub

services:
    llama-server:
        container_name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:server${LLAMA_SUFFIX:-}
        env_file:
            - path: ./.run/model.env
              required: false
        volumes:
            - ${MODELS_DIR:-./models}:/models:ro
            # Caché JIT de CUDA persistente. Sin esto, al RECREAR el contenedor
            # (docker rm + up) la caché se pierde y la 1ª inferencia recompila
            # kernels ~decenas de segundos. Con restart/stop-start se conservaba.
            - ${CUDA_CACHE_DIR:-./.cache/nv}:/root/.nv
        ports:
            - "${PORT:-18080}:8080"
        mem_limit: ${MEM_LIMIT:-0}
        cpus: ${CPUS:-0}
        restart: ${RESTART_POLICY:-no}
        stop_grace_period: 20s
        # Mientras el modelo carga, /health responde 503 y el healthcheck de la
        # imagen (sin start-period) marca "unhealthy". El nuestro espera
        # HEALTH_START_PERIOD antes de contar fallos, evitando ese falso negativo.
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: ${HEALTH_START_PERIOD:-300s}

# Red compartida por todos los proyectos del usuario (visibilidad local).
networks:
    default:
        name: proxylan
        external: true
