# =============================================================================
# llama-hub — override AMD nativo (ROCm).
# Solo para GPUs soportadas oficialmente por ROCm (gfx90x/gfx94x/gfx110x...).
# En GPUs no soportadas (p. ej. gfx1032) usa compose/docker-compose.amd-vulkan.yml.
#   docker compose -f docker-compose.yml -f compose/docker-compose.amd-rocm.yml up -d
#
# `group_add` usa los GID numéricos del host (VIDEO_GID/RENDER_GID, resueltos por
# lib/common.sh): Docker resuelve los nombres contra el /etc/group de la imagen,
# que no trae `render`. Si el host no tiene el grupo, se cae a 0 (ya presente).
# =============================================================================
name: llama-hub

services:
    llama-server:
        image: ghcr.io/ggml-org/llama.cpp:server-rocm${LLAMA_SUFFIX:-}
        devices:
            - /dev/kfd:/dev/kfd
            - ${AMD_RENDER_NODE:-/dev/dri}:/dev/dri
        group_add:
            - "${VIDEO_GID:-0}"
            - "${RENDER_GID:-0}"
